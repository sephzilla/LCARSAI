[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcarsai"
version = "0.1.0"
description = "Local-first, voice-first LCARS-inspired desktop assistant"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "zstandard>=0.22", "truststore>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lcarsai = "lcarsai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
